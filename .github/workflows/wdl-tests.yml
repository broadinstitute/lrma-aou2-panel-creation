name: Test WDLs

on:
  push:
    branches: [ 'main', 'sl_aou2_v1' ]
  pull_request:
    branches: [ 'main', 'sl_aou2_v1' ]

env:
  CROMWELL_VERSION: 91

jobs:

  # Fast, self-contained contract tests for GLIMPSE2Phase argument handling and resource
  # sizing. No Cromwell, no LFS, no cloud, no GLIMPSE2 binary -- runs in seconds, so unlike
  # the plumbing tests below it is blocking rather than advisory.
  phaseArgContract:
    runs-on: ubuntu-latest
    name: GLIMPSE2Phase argument and sizing contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 'phase argument and sizing contract'
        run: bash test/wdl/test-phase-arg-handling.sh
      # Blocking only for the file this branch changes. A repo-wide sweep runs below as
      # advisory, so a pre-existing quirk in an untouched WDL cannot fail CI on sl_aou2_v1.
      - name: 'task command blocks (changed file)'
        run: python3 test/wdl/check-command-blocks.py wdl/methods/imputation/GLIMPSE2FromPreprocessedPLsJoint.wdl
      - name: 'task command blocks (repo-wide, advisory)'
        continue-on-error: true
        run: |
          for f in $(find wdl -name '*.wdl'); do
            python3 test/wdl/check-command-blocks.py "$f" || echo "advisory: $f"
          done

  #Run WDL plumbing tests
  wdlTests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wdlTest: [ 'statistical-phasing-wdl', 'statistical-phasing-wdl-shapeit5', 'pangenie-panel-creation-wdl' ]
    continue-on-error: true
    name: WDL test ${{ matrix.wdlTest }} on Cromwell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/purge-runner-disk
      - name: pull lfs files
        run: git lfs pull
      - name: Set up java 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62  # v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: ./.github/actions/install-cromwell
        with:
          CROMWELL_VERSION: ${{ env.CROMWELL_VERSION }}
      - uses: ./.github/actions/install-jq
      - uses: ./.github/actions/install-bcftools

      - name: 'statistical-phasing-wdl'
        if: ${{ matrix.wdlTest == 'statistical-phasing-wdl' }}
        run: |
          echo 'Running statistical phasing WDL';
          bash test/cromwell/statistical-phasing.sh;

      - name: 'statistical-phasing-wdl-shapeit5'
        if: ${{ matrix.wdlTest == 'statistical-phasing-wdl-shapeit5' }}
        run: |
          echo 'Running statistical phasing WDL (Shapeit5)';
          bash test/cromwell/statistical-phasing-shapeit5.sh;

      - name: 'pangenie-panel-creation-wdl'
        if: ${{ matrix.wdlTest == 'pangenie-panel-creation-wdl' }}
        run: |
          echo 'Running PanGenie panel-creation WDL';
          bash test/cromwell/pangenie-panel-creation.sh;
